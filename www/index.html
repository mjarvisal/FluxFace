    <script>
        let global_settings = {};
        let config = {};

        function ApplyThemeSelect() {
            const getStoredTheme = () => localStorage.getItem('theme')
            const setStoredTheme = theme => localStorage.setItem('theme', theme)

            const getPreferredTheme = () => {
                const storedTheme = getStoredTheme()
                if (storedTheme) {
                    return storedTheme
                }

                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
            }

            const setTheme = theme => {
                if (theme === 'auto') {
                    document.documentElement.setAttribute('data-bs-theme', (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'))
                } else {
                    document.documentElement.setAttribute('data-bs-theme', theme)
                }
            }

            setTheme(getPreferredTheme())

            const showActiveTheme = (theme, focus = false) => {
                const themeSwitcher = document.querySelector('#bd-theme')

                if (!themeSwitcher) {
                    return
                }

                const themeSwitcherText = document.querySelector('#bd-theme-text')
                const activeThemeIcon = document.querySelector('.theme-icon-active use')
                const btnToActive = document.querySelector(`[data-bs-theme-value="${theme}"]`)
                // const svgOfActiveBtn = btnToActive.querySelector('svg use').getAttribute('href')

                document.querySelectorAll('[data-bs-theme-value]').forEach(element => {
                    element.classList.remove('active')
                    element.setAttribute('aria-pressed', 'false')
                })

                btnToActive.classList.add('active')
                btnToActive.setAttribute('aria-pressed', 'true')
                // activeThemeIcon.setAttribute('href', svgOfActiveBtn)
                const themeSwitcherLabel = `${themeSwitcherText.textContent} (${btnToActive.dataset.bsThemeValue})`
                themeSwitcher.setAttribute('aria-label', themeSwitcherLabel)

                if (focus) {
                    themeSwitcher.focus()
                }
            }

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                const storedTheme = getStoredTheme()
                if (storedTheme !== 'light' && storedTheme !== 'dark') {
                    setTheme(getPreferredTheme())
                }
            })

            window.addEventListener('DOMContentLoaded', () => {
                showActiveTheme(getPreferredTheme())

                document.querySelectorAll('[data-bs-theme-value]')
                    .forEach(toggle => {
                        toggle.addEventListener('click', () => {
                            const theme = toggle.getAttribute('data-bs-theme-value')
                            setStoredTheme(theme)
                            setTheme(theme)
                            showActiveTheme(theme, true)
                        })
                    })
            })
        }

        document.getElementById('refWifiBtn').addEventListener('click', async function () {
        const url = "/api/wifi";
        // Perform GET request
        const WifiSSID = document.querySelector('#WIFISSID').value??"";
        const WifiPassword = document.querySelector('#WIFIPassword').value??"";
        SetSettings("WIFISSID", WifiSSID);
        SetSettings("WIFIPassword", WifiPassword);
        await SendSettings();
        fetch(url, { method: 'GET' })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                return response.json();
            })
        });

        document.getElementById('refRebootBtn').addEventListener('click', function () {
        
        const url = "/api/reboot";
        // Perform GET request
        fetch(url, { method: 'GET' })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                return response.json();
            })
        });

        let otaPollTimer = null;

        function OtaShowStatus(message, type = "secondary") {
            const el = document.getElementById('otaStatus');
            if (!el) return;
            el.innerHTML = message ? `<span class="text-${type}">${message}</span>` : "";
        }

        function OtaShowProgress(show, percent) {
            const wrap = document.getElementById('otaProgressWrap');
            const bar = document.getElementById('otaProgressBar');
            if (!wrap || !bar) return;
            wrap.classList.toggle('d-none', !show);
            if (show) {
                const p = (percent >= 0 && percent <= 100) ? percent : 0;
                bar.style.width = `${p}%`;
                bar.textContent = `${p}%`;
            }
        }

        async function OtaCheck() {
            const checkBtn = document.getElementById('otaCheckBtn');
            const updateBtn = document.getElementById('otaUpdateBtn');
            const remote = document.getElementById('otaRemoteVersion');

            checkBtn.disabled = true;
            OtaShowStatus("Checking for updates…", "secondary");
            try {
                const res = await fetch("/api/ota/check", { method: 'GET' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                if (data.current) {
                    document.getElementById('otaCurrentVersion').textContent = data.current;
                }
                remote.textContent = data.remote || "–";

                if (data.error) {
                    OtaShowStatus(data.error, "danger");
                    updateBtn.classList.add('d-none');
                    updateBtn.disabled = true;
                } else if (data.available) {
                    OtaShowStatus(`Update available: ${data.remote}`, "success");
                    updateBtn.classList.remove('d-none');
                    updateBtn.disabled = false;
                } else {
                    OtaShowStatus("You are running the latest firmware.", "success");
                    updateBtn.classList.add('d-none');
                    updateBtn.disabled = true;
                }
            } catch (e) {
                OtaShowStatus("Could not check for updates. Check the connection.", "danger");
            } finally {
                checkBtn.disabled = false;
            }
        }

        function OtaPollStatus() {
            otaPollTimer = setInterval(async () => {
                try {
                    const res = await fetch("/api/ota/status", { method: 'GET' });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();

                    if (data.state === "downloading") {
                        OtaShowProgress(true, data.progress);
                        OtaShowStatus(data.message || "Downloading firmware…", "secondary");
                    } else if (data.state === "success") {
                        clearInterval(otaPollTimer);
                        OtaShowProgress(true, 100);
                        OtaShowStatus("Update complete. The device is rebooting…", "success");
                    } else if (data.state === "error") {
                        clearInterval(otaPollTimer);
                        OtaShowProgress(false, 0);
                        OtaShowStatus(data.message || "Update failed.", "danger");
                        document.getElementById('otaCheckBtn').disabled = false;
                    }
                } catch (e) {
                    // Device may be rebooting after a successful update; stop polling quietly.
                    clearInterval(otaPollTimer);
                }
            }, 1000);
        }

        async function OtaUpdate() {
            const checkBtn = document.getElementById('otaCheckBtn');
            const updateBtn = document.getElementById('otaUpdateBtn');
            updateBtn.disabled = true;
            checkBtn.disabled = true;
            OtaShowStatus("Starting update…", "secondary");
            OtaShowProgress(true, 0);
            try {
                const res = await fetch("/api/ota/update", { method: 'POST' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (!data.started) {
                    OtaShowStatus(data.error || "Could not start the update.", "danger");
                    OtaShowProgress(false, 0);
                    checkBtn.disabled = false;
                    return;
                }
                OtaPollStatus();
            } catch (e) {
                OtaShowStatus("Could not start the update.", "danger");
                OtaShowProgress(false, 0);
                checkBtn.disabled = false;
            }
        }

        async function OtaLoadCurrentVersion() {
            try {
                const res = await fetch("/api/ota/check", { method: 'GET' });
                if (!res.ok) return;
                const data = await res.json();
                if (data.current) {
                    document.getElementById('otaCurrentVersion').textContent = data.current;
                }
                const remote = document.getElementById('otaRemoteVersion');
                if (!data.error && data.remote) {
                    remote.textContent = data.remote;
                    if (data.available) {
                        OtaShowStatus(`Update available: ${data.remote}`, "success");
                        const updateBtn = document.getElementById('otaUpdateBtn');
                        updateBtn.classList.remove('d-none');
                        updateBtn.disabled = false;
                    }
                }
            } catch (e) {
                // Ignore; the user can press "Check for updates" manually.
            }
        }

        document.getElementById('otaCheckBtn').addEventListener('click', OtaCheck);
        document.getElementById('otaUpdateBtn').addEventListener('click', OtaUpdate);

        function togglePasswordVisibility(inputId, toggleIconId) {
            const passwordInput = document.getElementById(inputId);
            const toggleIcon = document.getElementById(toggleIconId);
            
            if (passwordInput.type === 'password') {
                // Show the password
                passwordInput.type = 'text';
                // Change the icon to 'eye' (open)
                toggleIcon.classList.remove('bi-eye-slash');
                toggleIcon.classList.add('bi-eye');
            } else {
                // Hide the password
                passwordInput.type = 'password';
                // Change the icon to 'eye-slash' (closed)
                toggleIcon.classList.remove('bi-eye');
                toggleIcon.classList.add('bi-eye-slash');
            }
        }

        async function FetchSettings() {
            const data = await fetch("settings.json");
            global_settings = await data.json();
            const data2 = await fetch("config.json");
            config = await data2.json();
        }

        function GenTextSetting(section, key, setting) {
            return `
                <h3 class="my-3">${setting.title ?? ""}</h3>
                <input onchange="SaveSettings('${key}', this.value);" id="${key}" class="form-control" type="text" value="${config[section][key] ?? setting.defaultValue ?? "n/a"}" />
            `;
        }

        function GenPasswordSetting(section, key, setting) {
            // 1. Define the unique IDs for the input and the toggle icon
            const toggleIconId = `${key}_icon`;
            
            return `
                <h3 class="my-3">${setting.title ?? ""}</h3>
                
                <div class="input-group my-1">
                    <input 
                        onchange="SaveSettings('${key}', this.value);" 
                        id="${key}" 
                        class="form-control" 
                        type="password"  value="${config[section][key] ?? setting.defaultValue ?? ""}" 
                        placeholder="Enter password"
                    />
                    <button 
                        class="btn btn-outline-secondary" 
                        type="button" 
                        onclick="togglePasswordVisibility('${key}', '${toggleIconId}')" >
                        <i class="bi bi-eye-slash" id="${toggleIconId}"></i> </button>
                </div>
            `;
        }


        function GenSelectSetting(section, key, setting) {
            let options = "";
            for (const opt of setting.options) {
                let selected = "";
                if (opt.value == config[section][key]) {
                    selected = "selected";
                }
                options += `<option value="${opt.value}" ${selected}>${opt.label}</option>`;
            }

            return `
            <h3 class="mt-4 my-2">${setting.title ?? ""}</h3>
            <label for="${key}" class="form-label">${setting.info ?? ""}</label>
            <select onchange="SaveSettings('${key}', this.value);" id="${key}" class="form-select" aria-label="${key}">
                ${options}
            </select>
            `;
        }

        function GenColorSetting(section, key, setting) {
            let info = "";
            if (setting.title) {
                info += `<h3 class="mt-4 mb-2">${setting.title ?? ""}</h3>`;
            }
            if (setting.info) {
                info += `<label for="${key}" class="form-label">${setting.info ?? ""}</label>`;
            }

            return `
            ${info}
            <input onchange="SaveSettings('${key}', this.value);" id="${key} name="${key} type="color" class="form-control form-control-lg" value="${config[section][key] ?? setting.defaultValue ?? "#000000"}" aria-label="${key}">
            `;
        }

        function GenNumericSetting(section, key, setting) {
            return `
            <div class="input-group my-3">
                <span class="input-group-text">${setting.title}</span>
                <input onchange="SaveSettings('${key}', this.value);" id="${key}" name="${key}" type="number" min="${setting.min}" max="${setting.max}" step="${setting.step}"class="form-control" value="${config[section][key] ?? setting.defaultValue ?? "-1"}" aria-label="${key}">
                <span class="input-group-text">${setting.info}</span>
            </div>`;
        }


        function GenTitle(section, key, setting) {
            return `<h3 class="mt-3">${setting.title ?? ""}</h3>`;
        }

        function GenTimeSetting(section, key, setting) {
            return `
               <label for="${key}" class="form-label">${setting.title}</label>
               <input onchange="SaveSettings('${key}', this.value);" id="${key} name="${key}" type="time" aria-label="${key}" class="form-control" value="${config[section][key] ?? setting.defaultValue ?? "00:00"}" />
               `;
        }

        function GenSwitchSetting(section, key, setting) {
            let checked = "";
            const value = config[section][key] ?? setting.defaultValue ?? false;
            if (value) {
                checked = "checked";
            }
            return `
            <div class="form-check form-switch">
                <input onchange="SaveSettings('${key}', this.checked);"  class="form-check-input" type="checkbox" role="switch" id="${key}" ${checked}>
                <label class="form-check-label" for="${key}">${setting.info}</label>
            </div>`;
        }

        function GenRangeSetting(section, key, setting) {
            const value = config[section][key] ?? setting.defaultValue ?? 0;
            return `
            <label for="${key}" class="form-label">${setting.title}: <output for="${key}" id="${key}Value"></output>${setting.info}</label>
            <input onchange="SaveSettings('${key}', this.value);" id="${key}" type="range" aria-label="${key}" class="form-range" min="${setting.min}" max="${setting.max}" step="${setting.step}" value="${value}">
            `;
        }

        function ApplyRange(key) {
            const Input = document.getElementById(key);
            const Output = document.getElementById(key + 'Value');

            // Set initial value
            Output.textContent = Input.value;

            Input.addEventListener('input', function () {
                Output.textContent = this.value;
            });
        }

        async function SendSettings() {
            const data = await fetch("/api/settings", {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(config)
            });
        }

        function SetSettings(key, value) {
            for (const id in config) {
                const section = config[id];
                for (const name in section) {
                    if (name === key) {
                        section[name] = value;
                        break;
                    }
                }
            }
        }

        async function SaveSettings(key, value) {
            SetSettings(key, value);

            await SendSettings();
            // jos tarvii debuggaa mitä sun appsi palauttaa, niin tällä onnistuu:
            //  console.log(await data.text());
        }



        function GenSettings(elem, section) {
            elem.innerHTML = "";
            const data = global_settings.data[section];
            for (const key in data) {

                const setting = data[key];
                switch (setting.type) {
                    case "title": {
                        elem.innerHTML += GenTitle(section, key, setting);
                        break;
                    }
                    case "text": {
                        elem.innerHTML += GenTextSetting(section, key, setting);
                        break;
                    }
                    case "select": {
                        elem.innerHTML += GenSelectSetting(section, key, setting);
                        break;
                    }
                    case "password": {
                        elem.innerHTML += GenPasswordSetting(section, key, setting);
                        break;
                    }
                    case "numeric": {
                        elem.innerHTML += GenNumericSetting(section, key, setting);
                        break;
                    }
                    case "color": {
                        elem.innerHTML += GenColorSetting(section, key, setting);
                        break;
                    }
                    case "time": {
                        elem.innerHTML += GenTimeSetting(section, key, setting);
                        break;
                    }
                    case "switch": {
                        elem.innerHTML += GenSwitchSetting(section, key, setting);
                        break;
                    }
                    case "range": {
                        elem.innerHTML += GenRangeSetting(section, key, setting);
                        setTimeout(() => ApplyRange(key), 500);
                        break;
                    }
                }
            }
        }

        async function render() {
            const WifiElem = document.querySelector("#Wifi");
            const LimitsElem = document.querySelector("#Limits");
            const DisplayElem = document.querySelector("#Display");

            GenSettings(WifiElem, "Wifi");
            GenSettings(LimitsElem, "Limits");
            GenSettings(DisplayElem, "Display");

        }

        (async () => {
            'use strict'
            ApplyThemeSelect();
            await FetchSettings();
            render();
            OtaLoadCurrentVersion();
        })();



    </script>
</body>

</html>
